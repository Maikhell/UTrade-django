{# Returns + Refund tab buttons, styled like the wf-tabs in workflow.html. Inserted before "Completed". #}
<li class="nav-item" role="presentation">
  <button class="nav-link" id="returns-tab" data-bs-toggle="tab" data-bs-target="#returns-pane"
          type="button" role="tab" aria-controls="returns-pane" aria-selected="false">
    <i class="bi bi-arrow-return-left"></i>
    <span>Returns</span>
    <span class="wf-pill is-processing">{{ return_count|default:0 }}</span>
    {% if return_new_count %}<span class="wf-pill is-rejected" title="Waiting for your response">{{ return_new_count }} new</span>{% endif %}
  </button>
</li>
<li class="nav-item" role="presentation">
  <button class="nav-link" id="refund-tab" data-bs-toggle="tab" data-bs-target="#refund-pane"
          type="button" role="tab" aria-controls="refund-pane" aria-selected="false">
    <i class="bi bi-cash-coin"></i>
    <span>Refund</span>
    <span class="wf-pill is-rejected">{{ refund_count|default:0 }}</span>
  </button>
</li>
