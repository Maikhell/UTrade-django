{% extends 'UTrade_app/base.html' %}
{% load static %}
{% block title %}
  Add Items
{% endblock %}
{% block content %}
  <section class="flex flex-col md:flex-row items-center justify-center min-h-screen bg-green-400 p-4">
    <div class="container bg-white p-6 justify-items-start">
      <div>
        <h2 class="text-center">Add Product</h2>
      </div>
      <div class="bg-white/20 p-6 rounded-full backdrop-blur-sm mb-6 justify-items-center items-center">
        <img src="{% static 'UTrade_app/img/U.png' %}" alt="Logo" class="max-w-[200px] w-full h-auto drop-shadow-lg" />
        <label class="block text-sm font-semibold text-gray-700 mb-2 text-center">Product Image</label>
        <button type="submit" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-xl shadow-lg transform transition active:scale-95">Add Image</button>
      </div>
      <div class="w-96">
        <label class="block text-sm font-semibold text-gray-700 mb-2">Product Name</label>
        <input type="text" name="product_name" placeholder="pencil case, graham balls," class="w-full px-4 py-3 rounded-xl bg-gray-50 border-gray-200 focus:ring-2 focus:ring-green-400 focus:border-transparent outline-none transition-all" />
      </div>
      <div class="w-96">
        <label class="block text-sm font-semibold text-gray-700 mb-2">Product Description</label>
        <textarea name="product_description" placeholder="Homemade graham balls with sprinkle toppings with many varieties" rows="4" class="w-full px-4 py-3 rounded-xl bg-gray-50 border-gray-200 focus:ring-2 focus:ring-green-400 focus:border-transparent outline-none transition-all resize-y"></textarea>
      </div>
    </div>
  </section>
{% endblock %}
