{% extends 'UTrade_app/base.html' %}
{% load static %}

{% block title %} Add Items {% endblock %}

{% block content %}
<style>
    /* Custom styles for the product upload experience */
    .rounded-4 { border-radius: 1.5rem !important; }
    .form-control-xl { border-radius: 0.75rem !important; padding: 0.75rem 1rem; border: 1px solid #dee2e6; background-color: #f8f9fa; }
    .form-control-xl:focus { box-shadow: 0 0 0 0.25rem rgba(25, 135, 84, 0.25); border-color: #198754; background-color: #fff; }
    
    .upload-box {
        border: 2px dashed #dee2e6;
        background-color: #f8f9fa;
        transition: all 0.3s ease;
        border-radius: 1.5rem;
    }
    .upload-box:hover {
        border-color: #198754;
        background-color: #fff;
    }
</style>

<section class="row g-0 min-vh-100 align-items-center justify-content-center bg-success py-5">
    <div class="col-11 col-sm-9 col-md-7 col-lg-5 col-xl-4">
        <div class="card border-0 shadow-lg p-4 p-md-5 rounded-4">
            
            <div class="text-center mb-4">
                <h2 class="fw-bold text-dark tracking-tight">Add Product</h2>
                <div class="mx-auto bg-success mt-2 rounded-pill" style="height: 4px; width: 40px;"></div>
            </div>

            {% if form.errors %}
                <div class="alert alert-danger rounded-3 small">
                    {{ form.errors }}
                </div>
            {% endif %}

            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="upload-box p-4 mb-4 text-center">
                    <img src="{% static 'UTrade_app/img/U.png' %}" alt="Logo" class="img-fluid mb-3" style="max-width: 120px; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.1));" />
                    <label class="d-block small fw-bold text-secondary mb-3">Product Image Preview</label>
                    
                    <input type="file" name="image" id="product_image" class="d-none" accept="image/*" />
                    <label for="product_image" class="btn btn-success px-4 fw-bold rounded-3 shadow-sm">
                        <i class="bi bi-image me-2"></i>Add Image
                    </label>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-bold text-secondary">Product Name</label>
                    <input type="text" name="name" required placeholder="pencil case, graham balls..." class="form-control form-control-xl" />
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-bold text-secondary">Product Description</label>
                    <textarea name="description" required placeholder="Homemade graham balls..." rows="3" class="form-control form-control-xl"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-bold text-secondary">Category</label>
                    <select name="category" required class="form-select form-control-xl cursor-pointer">
                        <option value="" disabled selected>Select a Category</option>
                        {% for category in categories %}
                            <option value="{{ category.id }}">{{ category.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-6">
                        <label class="form-label small fw-bold text-secondary">Price (₱)</label>
                        <input type="number" name="price" step="0.01" required placeholder="0.00" class="form-control form-control-xl" />
                    </div>
                    <div class="col-6">
                        <label class="form-label small fw-bold text-secondary">Stocks</label>
                        <input type="number" name="stocks" required placeholder="1" class="form-control form-control-xl" />
                    </div>
                </div>

                <button type="submit" class="btn btn-success btn-lg w-100 fw-bold rounded-3 shadow py-3 transition">
                    List Product
                </button>
            </form>

        </div>
    </div>
</section>
{% endblock %}
