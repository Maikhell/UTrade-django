{% extends 'UTrade_app/base.html' %}
{% load static %}
{% block title %}
  Add Items
{% endblock %}
{% block content %}
  <section class="flex flex-col md:flex-row items-center justify-center min-h-screen bg-green-400 p-4">
    <div class="container max-w-md bg-white p-8 rounded-3xl shadow-2xl">
      <div class="mb-6">
        <h2 class="text-3xl font-extrabold text-green-900 text-center tracking-tight">Add Product</h2>
      </div>

      <form method="POST" enctype="multipart/form-data" class="space-y-5">
        {% csrf_token %}

        <div class="bg-gray-50 p-6 rounded-3xl border-2 border-dashed border-gray-200 flex flex-col items-center justify-center transition-all hover:border-green-400">
          <img src="{% static 'UTrade_app/img/U.png' %}" alt="Logo" class="max-w-[150px] w-full h-auto drop-shadow-lg mb-4" />

          <label class="block text-sm font-semibold text-gray-700 mb-3 text-center">Product Image Preview</label>

          <input type="file" name="product_image" id="product_image" style="display: none;" accept="image/*" />

          <label for="product_image" class="cursor-pointer w-full text-center bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-xl shadow-lg transform transition active:scale-95">Add Image</label>
        </div>

        <div class="w-full">
          <label class="block text-sm font-semibold text-gray-700 mb-2">Product Names</label>
          <input type="text" name="product_name" required placeholder="pencil case, graham balls..." class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:ring-2 focus:ring-green-400 focus:border-transparent outline-none transition-all" />
        </div>

        <div class="w-full">
          <label class="block text-sm font-semibold text-gray-700 mb-2">Product Description</label>
          <textarea name="product_description" required placeholder="Homemade graham balls with sprinkle toppings..." rows="3" class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:ring-2 focus:ring-green-400 focus:border-transparent outline-none transition-all resize-y"></textarea>
        </div>

        <div class="flex space-x-4">
          <div class="flex-1">
            <label class="block text-sm font-semibold text-gray-700 mb-2">Price (₱)</label>
            <input type="number" name="product_price" step="0.01" required placeholder="0.00" class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:ring-2 focus:ring-green-400 focus:border-transparent outline-none transition-all" />
          </div>
          <div class="flex-1">
            <label class="block text-sm font-semibold text-gray-700 mb-2">Quantity</label>
            <input type="number" name="product_quantity" required placeholder="1" class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:ring-2 focus:ring-green-400 focus:border-transparent outline-none transition-all" />
          </div>
        </div>

        <div class="pt-4">
          <button type="submit" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-4 rounded-xl shadow-lg transform transition active:scale-95 text-lg">List Product</button>
        </div>
      </form>
    </div>
  </section>
{% endblock %}
