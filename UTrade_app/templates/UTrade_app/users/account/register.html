{% extends 'UTrade_app/base.html' %}
{% load static %}
{% block title %}
  Register
{% endblock %}
{% block content %}
  <section class="flex flex-col md:flex-row items-center justify-center min-h-screen bg-green-400 p-4">
    <div class="flex-1 flex flex-col justify-center items-center p-8 text-center">
      <div class="bg-white/20 p-6 rounded-full backdrop-blur-sm mb-6">
        <img src="{% static 'UTrade_app/img/U.png' %}" alt="Logo" class="max-w-[200px] w-full h-auto drop-shadow-lg" />
      </div>
      <h1 class="text-4xl font-extrabold text-white tracking-tight">UTRADE</h1>
      <p class="text-green-900 mt-2 font-medium">Your gateway to smarter trading.</p>
    </div>

    <div class="flex-1 flex justify-center items-center w-full">
      <div class="bg-white p-8 md:p-12 rounded-3xl shadow-2xl w-full max-w-md transition-all hover:shadow-3xl">
        <h2 class="text-3xl font-bold text-gray-800 mb-2">Welcome</h2>
        <p class="text-gray-500 mb-8">Please enter your details to sign up.</p>

        <form method="post" action="" class="space-y-6" >
          {% csrf_token %}

          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Student No</label>
            <input type="text" name="studentNumber" placeholder="000000000" class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:ring-2 focus:ring-green-400 focus:border-transparent outline-none transition-all" />
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Email</label>
            <input type="email" name="email" placeholder="johndoe@email.com" class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:ring-2 focus:ring-green-400 focus:border-transparent outline-none transition-all" />
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
            <input type="password" name="password" placeholder="••••••••" class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:ring-2 focus:ring-green-400 focus:border-transparent outline-none transition-all" />
          </div>

          <div class="flex items-center justify-between text-sm">
            <label class="flex items-center text-gray-600"><input type="checkbox" class="mr-2 rounded border-gray-300 text-green-500 focus:ring-green-400" />Remember me</label>
            <a href="#" class="text-green-600 font-semibold hover:underline">Forgot password?</a>
          </div>

          <button type="submit" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-xl shadow-lg transform transition active:scale-95">Sign Up</button>
        </form>

        <p class="text-center text-gray-600 mt-8">
          Don't have an account? <a href="#" class="text-green-600 font-bold hover:underline">Register</a>
        </p>
      </div>
    </div>
  </section>
{% endblock %}
